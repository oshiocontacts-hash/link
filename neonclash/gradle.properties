org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=false

mod_id=neonclash
mod_name=Neon Clash
mod_version=0.1.0
mod_group_id=com.neonclash
mod_authors=neonclash
mod_description=Fast, stylish team PvP mini-game built on TaCZ.

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[47,)

# TaCZ (Timeless and Classics Zero) を CurseMaven から取得する。
# CurseForge 上のプロジェクト ID と、取得したい 1.20.1 版ファイルの File ID を指定する。
# 開発環境から CurseForge / CurseMaven に到達できなかったため File ID は未確定（README「判断ログ」参照）。
# 最新の 1.20.1 版ファイルの ID を CurseForge の Files タブで確認して設定すること。
tacz_curse_project=timeless-and-classics-zero-1028108
tacz_curse_file_id=
# CurseMaven を使わずローカル jar を使う場合は mod/libs/<name>-<version>.jar に置いて指定する
# 例: mod/libs/tacz-1.20.1-1.1.7.jar → tacz_local_name=tacz, tacz_local_version=1.20.1-1.1.7
tacz_local_name=
tacz_local_version=
tacz_version_range=[1.1.0,)
