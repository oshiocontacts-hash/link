name: Record Neon Clash demo

# Forge 1.20.1 + TaCZ で Minecraft を仮想ディスプレイ（Xvfb + Mesa のソフトウェア描画）で起動し、
# 自動デモ（ワールド作成 → コマンドでアリーナと練習試合 → 自動操作 → 終了）を録画する。
# 画面はゲーム内の Screenshot.takeScreenshot で連番 PNG に保存し、ffmpeg で動画にする。
# ついでに GameTest も実行する。動画・ログは Artifacts と neonclash-demo-media ブランチに置く。
on:
  push:
    branches:
      - claude/neonclash-pvp-mod
    paths:
      - 'neonclash/**'
      - '.github/workflows/neonclash-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: neonclash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb, Mesa and ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb ffmpeg mesa-utils libgl1-mesa-dri libglx-mesa0
          python3 -m pip install -q numpy scipy
          mkdir -p media

      - name: Fetch TaCZ (Forge 1.20.1) from Modrinth
        id: tacz
        run: python3 ci/fetch_tacz.py 2>&1 | tee media/tacz.log

      - name: Build and unit tests
        id: build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace \
            -Ptacz_local_name=${{ steps.tacz.outputs.name }} -Ptacz_local_version=${{ steps.tacz.outputs.version }} \
            2>&1 | tee media/build.log
          cp mod/build/libs/*.jar media/ || true

      - name: Prepare game options
        run: |
          mkdir -p mod/run
          cat > mod/run/options.txt <<'OPTS'
          onboardAccessibility:false
          pauseOnLostFocus:false
          renderDistance:5
          simulationDistance:5
          graphicsMode:0
          maxFps:30
          enableVsync:false
          guiScale:2
          lang:ja_jp
          tutorialStep:none
          joinedFirstServer:true
          narrator:0
          fullscreen:false
          soundCategory_master:0.0
          OPTS

      - name: Run demo and record
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3
          glxinfo -B | grep -E 'OpenGL (renderer|core profile version)' || true
          status=0
          timeout 1800 ./gradlew :mod:runClient --stacktrace -Pneonclash.demo=true \
            -Ptacz_local_name=${{ steps.tacz.outputs.name }} -Ptacz_local_version=${{ steps.tacz.outputs.version }} \
            > media/runClient.log 2>&1 || status=$?
          tail -50 media/runClient.log
          echo "runClient exit status: $status"
          echo "frames: $(ls mod/run/demo_frames 2>/dev/null | wc -l)"
          test -f mod/run/demo_done

      - name: Encode video and frames
        if: always()
        run: |
          mkdir -p media/frames
          cp mod/run/logs/latest.log media/client-latest.log || true
          cp mod/run/demo_beat.json media/ || true
          if [ -d mod/run/demo_frames ]; then
            # ゲーム内で実時間 10fps で保存した連番 PNG を動画にする
            ffmpeg -y -loglevel error -framerate 10 -i mod/run/demo_frames/%05d.png \
              -vf "scale=1280:-2,format=yuv420p" -c:v libx264 -preset veryfast -crf 24 -r 30 media/neonclash-demo-silent.mp4
            # BGM（Python で合成、128 BPM・F マイナー）をゲーム内の拍に合わせて付ける
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 media/neonclash-demo-silent.mp4)
            python3 ci/groove.py --duration "$dur" --beat-json mod/run/demo_beat.json --out media/neonclash-groove.wav | tee media/groove.log
            ffmpeg -y -loglevel error -i media/neonclash-demo-silent.mp4 -i media/neonclash-groove.wav \
              -c:v copy -c:a aac -b:a 192k -shortest media/neonclash-demo.mp4
            ffmpeg -y -loglevel error -i media/neonclash-demo.mp4 -vf "fps=1/3,scale=640:-1" media/frames/f%03d.jpg
          fi
          ls -la media media/frames | head -100

      - name: GameTests
        if: always() && steps.build.outcome == 'success'
        run: |
          status=0
          timeout 900 ./gradlew :mod:runGameTestServer --stacktrace \
            -Ptacz_local_name=${{ steps.tacz.outputs.name }} -Ptacz_local_version=${{ steps.tacz.outputs.version }} \
            > media/gametest.log 2>&1 || status=$?
          echo "runGameTestServer exit status: $status" | tee -a media/gametest.log
          grep -E "GameTest|tests|passed|failed|neonclash" media/gametest.log | tail -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neonclash-demo
          path: neonclash/media

      - name: Publish to neonclash-demo-media branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd media
          echo "${GITHUB_SHA}" > SOURCE_COMMIT
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Neon Clash demo recording for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:neonclash-demo-media
