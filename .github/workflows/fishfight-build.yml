name: Build Fish Fight mod

on:
  push:
    paths:
      - 'fishfight-mod/**'
      - '.github/workflows/fishfight-build.yml'
  pull_request:
    paths:
      - 'fishfight-mod/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fishfight-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: fishfight-mod
          path: fishfight-mod/build/libs/*.jar
