name: Record Fish Fight demo

# Minecraft を仮想ディスプレイで起動し、自動デモ（釣り→バトル）を録画する（画面はゲーム内で保存）。
# 動画・スクリーンショット・ログは Artifacts と fishfight-demo-media ブランチに置く。
on:
  push:
    branches:
      - claude/fishfight-mod
    paths:
      - 'fishfight-mod/**'
      - '.github/workflows/fishfight-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fishfight-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb, Mesa and ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb ffmpeg mesa-utils libgl1-mesa-dri libglx-mesa0

      - name: Prepare game options
        run: |
          mkdir -p run-demo
          cat > run-demo/options.txt <<'EOF'
          onboardAccessibility:false
          pauseOnLostFocus:false
          renderDistance:5
          simulationDistance:5
          graphicsMode:0
          maxFps:30
          enableVsync:false
          guiScale:2
          lang:ja_jp
          tutorialStep:none
          joinedFirstServer:true
          narrator:0
          fullscreen:false
          soundCategory_master:0.0
          fov:-0.35
          EOF

      - name: Run demo and record
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3
          glxinfo -B | grep -E 'OpenGL (renderer|core profile version)' || true
          status=0
          timeout 1800 ./gradlew runDemo --stacktrace || status=$?
          echo "runDemo exit status: $status"
          ls -la run-demo
          echo "frames: $(ls run-demo/demo_frames 2>/dev/null | wc -l)"
          test -f run-demo/demo_done

      - name: Encode video and frames
        if: always()
        run: |
          mkdir -p media/frames
          cp run-demo/logs/latest.log media/latest.log || true
          if [ -d run-demo/demo_frames ]; then
            # ゲーム内で10fpsで保存した連番PNGを動画にする
            ffmpeg -y -loglevel error -framerate 10 -i run-demo/demo_frames/%05d.png \
              -vf "scale=960:-2,format=yuv420p" -c:v libx264 -preset veryfast -crf 26 -r 30 media/fishfight-demo.mp4
            ffmpeg -y -loglevel error -i media/fishfight-demo.mp4 -vf "fps=1/2,scale=640:-1" media/frames/f%03d.jpg
          fi
          ls -la media media/frames | head -100

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishfight-demo
          path: fishfight-mod/media

      - name: Publish to fishfight-demo-media branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd media
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Fish Fight demo recording for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fishfight-demo-media
